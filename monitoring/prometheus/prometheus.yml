global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: fastapi-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - gateway:8000
          - ai-service:8000
          - appointment-service:8000
          - consultation-service:8000
          - email-service:8000
          - prescription-service:8000
          - transcription-service:8000
          - user-service:8000

  - job_name: rabbitmq
    static_configs:
      - targets:
          - rabbitmq:15692

  - job_name: postgres
    static_configs:
      - targets:
          - appointment-db-exporter:9187
          - consultation-db-exporter:9187
          - prescription-db-exporter:9187
          - user-db-exporter:9187
          - ai-db-exporter:9187
