name: opd-vertex

networks:
    frontend:
        driver: bridge
    internal-api:
        driver: bridge
    bus:
        driver: bridge
    appointment-net:
        driver: bridge
    consultation-net:
        driver: bridge
    prescription-net:
        driver: bridge
    user-net:
        driver: bridge
    keycloak-net:
        driver: bridge

volumes:
    appointment_db_data:
    consultation_db_data:
    prescription_db_data:
    user_db_data:
    pgadmin_data:
    keycloak_pg_db_data:
    keycloak_db_data:


services:

    # ── Gateway ───────────────────────────────────────────────────────────────
    gateway:
        image: mita28/opdvertex:gateway-1.0.0
        build: backend/gateway/.
        container_name: gateway
        restart: unless-stopped
        ports:
            - "8080:8000"
        networks:
            - frontend
            - internal-api
        volumes:
            - ./backend/gateway/main.py:/app/main.py
            - ./backend/gateway/src:/app/src
        environment:
            AMQP_URL: amqp://${RABBITMQ_USERNAME}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
            USER_SERVICE_URL: http://user-service:8000
            APPOINTMENT_SERVICE_URL: http://appointment-service:8000
            CONSULTATION_SERVICE_URL: http://consultation-service:8000
            PRESCRIPTION_SERVICE_URL: http://prescription-service:8000
            AI_SERVICE_URL: http://ai-service:8000
            EMAIL_SERVICE_URL: http://email-service:8000
            TRANSCRIPTION_SERVICE_URL: http://transcription-service:8000
            ALLOWED_ORIGINS: http://localhost:5173
        depends_on:
            rabbitmq:
                condition: service_healthy
            keycloak:
                condition: service_healthy

    # ── AI Service ────────────────────────────────────────────────────────────
    ai-service:
        image: mita28/opdvertex:ai-service-1.0.0
        build: backend/ai-service/.
        container_name: ai-service
        restart: unless-stopped
        ports:
            - "8081:8000"
        networks:
            - internal-api
            - bus
        environment:
            AMQP_URL: amqp://${RABBITMQ_USERNAME}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
        depends_on:
            rabbitmq:
                condition: service_healthy

    # ── Appointment Service ───────────────────────────────────────────────────
    appointment-service:
        image: mita28/opdvertex:appointment-service-1.0.11
        build: backend/appointment-service/.
        container_name: appointment-service
        restart: unless-stopped
        ports:
            - "8082:8000"
        networks:
            - internal-api
            - bus
            - appointment-net
        environment:
            AMQP_URL: amqp://${RABBITMQ_USERNAME}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
            DATABASE_URL: postgresql://${APPOINTMENT_DB_USER}:${APPOINTMENT_DB_PASS}@appointment-db:5432/${APPOINTMENT_DB_NAME}
        depends_on:
            rabbitmq:
                condition: service_healthy
            appointment-db:
                condition: service_healthy

    appointment-db:
        image: postgres:17
        container_name: appointment-db
        restart: always
        environment:
            POSTGRES_USER: ${APPOINTMENT_DB_USER}
            POSTGRES_PASSWORD: ${APPOINTMENT_DB_PASS}
            POSTGRES_DB: ${APPOINTMENT_DB_NAME}
        ports:
            - "5432:5432"
        volumes:
            - appointment_db_data:/var/lib/postgresql/data
        networks:
            - appointment-net
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U ${APPOINTMENT_DB_USER} -d ${APPOINTMENT_DB_NAME}" ]
            interval: 5s
            timeout: 10s
            retries: 5
            start_period: 5s

    # ── Consultation Service ──────────────────────────────────────────────────
    consultation-service:
        image: mita28/opdvertex:consultation-service-1.0.0
        build: backend/consultation-service/.
        container_name: consultation-service
        restart: unless-stopped
        ports:
            - "8083:8000"
        networks:
            - internal-api
            - bus
            - consultation-net
        environment:
            AMQP_URL: amqp://${RABBITMQ_USERNAME}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
            DATABASE_URL: postgresql://${CONSULTATION_DB_USER}:${CONSULTATION_DB_PASS}@consultation-db:5432/${CONSULTATION_DB_NAME}
        depends_on:
            rabbitmq:
                condition: service_healthy
            consultation-db:
                condition: service_healthy

    consultation-db:
        image: postgres:17
        container_name: consultation-db
        restart: always
        environment:
            POSTGRES_USER: ${CONSULTATION_DB_USER}
            POSTGRES_PASSWORD: ${CONSULTATION_DB_PASS}
            POSTGRES_DB: ${CONSULTATION_DB_NAME}
        ports:
            - "5433:5432"
        volumes:
            - consultation_db_data:/var/lib/postgresql/data
        networks:
            - consultation-net
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U ${CONSULTATION_DB_USER} -d ${CONSULTATION_DB_NAME}" ]
            interval: 5s
            timeout: 10s
            retries: 5
            start_period: 5s

    # ── Email Service ─────────────────────────────────────────────────────────
    email-service:
        image: mita28/opdvertex:email-service-1.0.0
        build: backend/email-service/.
        container_name: email-service
        restart: unless-stopped
        ports:
            - "8084:8000"
        networks:
            - internal-api
            - bus
        environment:
            AMQP_URL: amqp://${RABBITMQ_USERNAME}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
        depends_on:
            rabbitmq:
                condition: service_healthy

    # ── Prescription Service ──────────────────────────────────────────────────
    prescription-service:
        image: mita28/opdvertex:prescription-service-1.0.0
        build: backend/prescription-service/.
        container_name: prescription-service
        restart: unless-stopped
        ports:
            - "8085:8000"
        networks:
            - internal-api
            - bus
            - prescription-net
        environment:
            AMQP_URL: amqp://${RABBITMQ_USERNAME}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
            DATABASE_URL: postgresql://${PRESCRIPTION_DB_USER}:${PRESCRIPTION_DB_PASS}@prescription-db:5432/${PRESCRIPTION_DB_NAME}
        depends_on:
            rabbitmq:
                condition: service_healthy
            prescription-db:
                condition: service_healthy

    prescription-db:
        image: postgres:17
        container_name: prescription-db
        restart: always
        environment:
            POSTGRES_USER: ${PRESCRIPTION_DB_USER}
            POSTGRES_PASSWORD: ${PRESCRIPTION_DB_PASS}
            POSTGRES_DB: ${PRESCRIPTION_DB_NAME}
        ports:
            - "5434:5432"
        volumes:
            - prescription_db_data:/var/lib/postgresql/data
        networks:
            - prescription-net
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U ${PRESCRIPTION_DB_USER} -d ${PRESCRIPTION_DB_NAME}" ]
            interval: 5s
            timeout: 10s
            retries: 5
            start_period: 5s

    # ── Transcription Service ─────────────────────────────────────────────────
    transcription-service:
        image: mita28/opdvertex:transcription-service-1.0.8
        build: backend/transcription-service/.
        container_name: transcription-service
        restart: unless-stopped
        ports:
            - "8086:8000"
        environment:
            AMQP_URL: amqp://${RABBITMQ_USERNAME}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
            WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE}
            HF_TOKEN: ${HF_TOKEN}
        networks:
            - internal-api
            - bus
        depends_on:
            rabbitmq:
                condition: service_healthy

    # ── User Service ──────────────────────────────────────────────────────────
    user-service:
        image: mita28/opdvertex:user-service-1.0.0
        build: backend/user-service/.
        container_name: user-service
        restart: unless-stopped
        ports:
            - "8087:8000"
        environment:
            DATABASE_URL: postgresql://${USER_DB_USER}:${USER_DB_PASS}@user-db:5432/${USER_DB_NAME}
            KEYCLOAK_REALM: opd-vertex
            KEYCLOAK_EXTERNAL_URL: http://localhost:8089
            AMQP_URL: amqp://${RABBITMQ_USERNAME}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
        networks:
            - internal-api
            - bus
            - user-net
        volumes:
            - ./backend/user-service/main.py:/app/main.py
            - ./backend/user-service/src:/app/src
        depends_on:
            rabbitmq:
                condition: service_healthy
            user-db:
                condition: service_healthy
            keycloak:
                condition: service_healthy

    user-db:
        image: postgres:17
        container_name: user-db
        restart: always
        environment:
            POSTGRES_USER: ${USER_DB_USER}
            POSTGRES_PASSWORD: ${USER_DB_PASS}
            POSTGRES_DB: ${USER_DB_NAME}
        ports:
            - "5435:5432"
        volumes:
            - user_db_data:/var/lib/postgresql/data
        networks:
            - user-net
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U ${USER_DB_USER} -d ${USER_DB_NAME}" ]
            interval: 5s
            timeout: 10s
            retries: 5
            start_period: 5s

    # ── RabbitMQ ──────────────────────────────────────────────────────────────
    rabbitmq:
        image: rabbitmq:4.1.4-management-alpine
        container_name: rabbitmq
        restart: always
        ports:
            - "9000:15672"
            - "5672:5672"
        networks:
            - bus
        healthcheck:
            test: [ "CMD", "rabbitmq-diagnostics", "check_running" ]
            interval: 5s
            timeout: 10s
            retries: 5
            start_period: 5s

    # ── pgAdmin ───────────────────────────────────────────────────────────────
    pgadmin:
        image: dpage/pgadmin4:9.9.0
        container_name: pgadmin
        restart: always
        environment:
            PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
            PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
        ports:
            - "5050:80"
        volumes:
            - pgadmin_data:/var/lib/pgadmin
        networks:
            - appointment-net
            - consultation-net
            - prescription-net
            - user-net

    # ── Keycloak ──────────────────────────────────────────────────────────────
    keycloak:
        image: quay.io/keycloak/keycloak:24.0.1
        container_name: keycloak
        restart: unless-stopped
        environment:
            KC_DB: postgres
            KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak_db
            KC_DB_USERNAME: keycloak_user
            KC_DB_PASSWORD: keycloak_pass
            KC_DB_SCHEMA: public
            KEYCLOAK_ADMIN: admin
            KEYCLOAK_ADMIN_PASSWORD: admin123
        command: start-dev --import-realm
        ports:
            - "8089:8080"
        networks:
            - frontend
            - internal-api
            - keycloak-net
        healthcheck:
            test: [ "CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 || exit 1" ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 20s
        depends_on:
            keycloak-db:
                condition: service_healthy

    keycloak-db:
        image: postgres:17
        container_name: keycloak-db
        restart: always
        environment:
            POSTGRES_USER: keycloak_user
            POSTGRES_PASSWORD: keycloak_pass
            POSTGRES_DB: keycloak_db
        ports:
            - "5436:5432"
        volumes:
            - keycloak_db_data:/var/lib/postgresql/data
        networks:
            - keycloak-net
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U keycloak_user -d keycloak_db" ]
            interval: 5s
            timeout: 10s
            retries: 5
            start_period: 5s
