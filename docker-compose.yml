name: opd-vertex

networks:
    frontend:
        driver: bridge
    internal-api:
        driver: bridge
    bus:
        driver: bridge
    appointment-net:
        driver: bridge
    consultation-net:
        driver: bridge
    prescription-net:
        driver: bridge
    user-net:
        driver: bridge
    ollama-net:
        driver: bridge
    ai-net:
        driver: bridge
    keycloak-net:
        driver: bridge

volumes:
    appointment_db_data:
    consultation_db_data:
    prescription_db_data:
    user_db_data:
    ai_db_data:
    pgadmin_data:
    ollama_data:
    keycloak_db_data:
    caddy_data:
    caddy_config:


services:

    # ── Gateway ───────────────────────────────────────────────────────────────
    gateway:
        image: mita28/opdvertex:gateway-6.0.0
        build: backend/gateway/.
        container_name: gateway
        restart: unless-stopped
        ports:
            - "127.0.0.1:8080:8000"
        environment:
            EMAIL_SERVICE_URL: http://email-service:8000
            AI_SERVICE_URL: http://ai-service:8000
            KEYCLOAK_REALM: opd-vertex
            KEYCLOAK_EXTERNAL_URL: ${PUBLIC_URL:-http://localhost:8089}/auth
            KEYCLOAK_INTERNAL_URL: http://keycloak:8080/auth
            KEYCLOAK_CLIENT_ID: vue-app
            # Trust X-Forwarded-Proto from Caddy so redirects use https://
            FORWARDED_ALLOW_IPS: "*"
        networks:
            - frontend
            - internal-api
        depends_on:
            rabbitmq:
                condition: service_healthy
            keycloak:
                condition: service_healthy

    # ── Ollama (OPTIONAL local LLM runtime) ───────────────────────────────────
    # By default the LLM + embeddings run on UCloud (see ucloud/README.md).
    # For offline work: `docker compose --profile local-llm up` and point
    # LLM_BASE_URL in .env at http://ollama:11434/v1 (see .env.example).
    ollama:
        image: ollama/ollama:latest
        container_name: ollama
        profiles: ["local-llm"]
        restart: unless-stopped
        ports:
            - "127.0.0.1:11434:11434"
        volumes:
            - ollama_data:/root/.ollama
        networks:
            - ollama-net
        entrypoint: >
            sh -c "ollama serve &
                   sleep 5 &&
                   ollama pull llama3.2:3b &&
                   ollama pull nomic-embed-text &&
                   wait"
        healthcheck:
            test: ["CMD-SHELL", "ollama list | grep -q 'llama3.2:3b'"]
            interval: 10s
            timeout: 30s
            retries: 30
            start_period: 30s

    # ── AI Database (pgvector) ────────────────────────────────────────────────
    ai-db:
        image: pgvector/pgvector:pg17
        container_name: ai-db
        restart: always
        environment:
            POSTGRES_USER: ${AI_DB_USER}
            POSTGRES_PASSWORD: ${AI_DB_PASS}
            POSTGRES_DB: ${AI_DB_NAME}
        ports:
            - "127.0.0.1:5436:5432"
        volumes:
            - ai_db_data:/var/lib/postgresql/data
        networks:
            - ai-net
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${AI_DB_USER} -d ${AI_DB_NAME}"]
            interval: 5s
            timeout: 10s
            retries: 5
            start_period: 5s

    # ── AI Service ────────────────────────────────────────────────────────────
    ai-service:
        image: mita28/opdvertex:ai-service-4.0.0
        build: backend/ai-service/.
        container_name: ai-service
        restart: unless-stopped
        ports:
            - "127.0.0.1:8081:8000"
        environment:
            AMQP_URL: amqp://${RABBITMQ_USERNAME}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
            # LLM + embeddings: UCloud vLLM job (default) or local Ollama
            LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
            LLM_API_KEY: ${LLM_API_KEY:-}
            LLM_MODEL: ${LLM_MODEL:-llama3.2:3b}
            EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
            LLM_TIMEOUT: ${LLM_TIMEOUT:-300}
            AI_DB_URL: postgresql://${AI_DB_USER}:${AI_DB_PASS}@ai-db:5432/${AI_DB_NAME}
        networks:
            - internal-api
            - bus
            - ollama-net
            - ai-net
        depends_on:
            rabbitmq:
                condition: service_healthy
            ai-db:
                condition: service_healthy

    # ── Appointment Service ───────────────────────────────────────────────────
    appointment-service:
        image: mita28/opdvertex:appointment-service-3.1.0
        build: backend/appointment-service/.
        container_name: appointment-service
        restart: unless-stopped
        ports:
            - "127.0.0.1:8082:8000"
        networks:
            - internal-api
            - bus
            - appointment-net
        depends_on:
            rabbitmq:
                condition: service_healthy
            appointment-db:
                condition: service_healthy

    appointment-db:
        image: postgres:17
        container_name: appointment-db
        restart: always
        environment:
            POSTGRES_USER: ${APPOINTMENT_DB_USER}
            POSTGRES_PASSWORD: ${APPOINTMENT_DB_PASS}
            POSTGRES_DB: ${APPOINTMENT_DB_NAME}
        ports:
            - "127.0.0.1:5432:5432"
        volumes:
            - appointment_db_data:/var/lib/postgresql/data
        networks:
            - appointment-net
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${APPOINTMENT_DB_USER} -d ${APPOINTMENT_DB_NAME}"]
            interval: 5s
            timeout: 10s
            retries: 5
            start_period: 5s

    # ── Consultation Service ──────────────────────────────────────────────────
    consultation-service:
        image: mita28/opdvertex:consultation-service-3.1.0
        build: backend/consultation-service/.
        container_name: consultation-service
        restart: unless-stopped
        ports:
            - "127.0.0.1:8083:8000"
        networks:
            - internal-api
            - bus
            - consultation-net
        depends_on:
            rabbitmq:
                condition: service_healthy
            consultation-db:
                condition: service_healthy

    consultation-db:
        image: postgres:17
        container_name: consultation-db
        restart: always
        environment:
            POSTGRES_USER: ${CONSULTATION_DB_USER}
            POSTGRES_PASSWORD: ${CONSULTATION_DB_PASS}
            POSTGRES_DB: ${CONSULTATION_DB_NAME}
        ports:
            - "127.0.0.1:5433:5432"
        volumes:
            - consultation_db_data:/var/lib/postgresql/data
        networks:
            - consultation-net
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${CONSULTATION_DB_USER} -d ${CONSULTATION_DB_NAME}"]
            interval: 5s
            timeout: 10s
            retries: 5
            start_period: 5s

    # ── Email Service ─────────────────────────────────────────────────────────
    email-service:
        image: mita28/opdvertex:email-service-7.0.0
        build: backend/email-service/.
        container_name: email-service
        restart: unless-stopped
        ports:
            - "127.0.0.1:8084:8000"
        env_file:
            - backend/email-service/.env
        environment:
            RABBITMQ_URL: amqp://${RABBITMQ_USERNAME}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
        networks:
            - internal-api
            - bus
        depends_on:
            rabbitmq:
                condition: service_healthy

    # ── Prescription Service ──────────────────────────────────────────────────
    prescription-service:
        image: mita28/opdvertex:prescription-service-4.1.0
        build: backend/prescription-service/.
        container_name: prescription-service
        restart: unless-stopped
        ports:
            - "127.0.0.1:8085:8000"
        networks:
            - internal-api
            - bus
            - prescription-net
        depends_on:
            rabbitmq:
                condition: service_healthy
            prescription-db:
                condition: service_healthy

    prescription-db:
        image: postgres:17
        container_name: prescription-db
        restart: always
        environment:
            POSTGRES_USER: ${PRESCRIPTION_DB_USER}
            POSTGRES_PASSWORD: ${PRESCRIPTION_DB_PASS}
            POSTGRES_DB: ${PRESCRIPTION_DB_NAME}
        ports:
            - "127.0.0.1:5434:5432"
        volumes:
            - prescription_db_data:/var/lib/postgresql/data
        networks:
            - prescription-net
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${PRESCRIPTION_DB_USER} -d ${PRESCRIPTION_DB_NAME}"]
            interval: 5s
            timeout: 10s
            retries: 5
            start_period: 5s

    # ── Transcription Service ─────────────────────────────────────────────────
    transcription-service:
        image: mita28/opdvertex:transcription-service-4.0.0
        build: backend/transcription-service/.
        container_name: transcription-service
        restart: unless-stopped
        ports:
            - "127.0.0.1:8086:8000"
        environment:
            AMQP_URL: amqp://${RABBITMQ_USERNAME}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
            # Remote faster-whisper on UCloud; leave WHISPER_API_URL empty for local CPU
            WHISPER_API_URL: ${WHISPER_API_URL:-}
            WHISPER_API_KEY: ${WHISPER_API_KEY:-}
            WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE}
            HF_TOKEN: ${HF_TOKEN}
        networks:
            - internal-api
            - bus
        depends_on:
            rabbitmq:
                condition: service_healthy

    # ── User Service ──────────────────────────────────────────────────────────
    user-service:
        image: mita28/opdvertex:user-service-3.1.0
        build: backend/user-service/.
        container_name: user-service
        restart: unless-stopped
        environment:
            # Used to fetch Keycloak's signing keys from inside the Docker network
            KEYCLOAK_EXTERNAL_URL: http://keycloak:8080/auth
        ports:
            - "127.0.0.1:8087:8000"
        networks:
            - internal-api
            - bus
            - user-net
        depends_on:
            rabbitmq:
                condition: service_healthy
            user-db:
                condition: service_healthy
            keycloak:
                condition: service_healthy

    user-db:
        image: postgres:17
        container_name: user-db
        restart: always
        environment:
            POSTGRES_USER: ${USER_DB_USER}
            POSTGRES_PASSWORD: ${USER_DB_PASS}
            POSTGRES_DB: ${USER_DB_NAME}
        ports:
            - "127.0.0.1:5435:5432"
        volumes:
            - user_db_data:/var/lib/postgresql/data
        networks:
            - user-net
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${USER_DB_USER} -d ${USER_DB_NAME}"]
            interval: 5s
            timeout: 10s
            retries: 5
            start_period: 5s

    # ── RabbitMQ ──────────────────────────────────────────────────────────────
    rabbitmq:
        image: rabbitmq:4.1.4-management-alpine
        container_name: rabbitmq
        restart: always
        ports:
            - "127.0.0.1:9000:15672"
            - "127.0.0.1:5672:5672"
        networks:
            - bus
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "check_running"]
            interval: 5s
            timeout: 10s
            retries: 5
            start_period: 5s

    # ── Mailpit (Local SMTP Testing) ──────────────────────────────────────────
    mailpit:
        image: axllent/mailpit
        container_name: mailpit
        restart: unless-stopped
        ports:
            - "127.0.0.1:8025:8025"
            - "127.0.0.1:1025:1025"
        networks:
            - bus

    # ── pgAdmin ───────────────────────────────────────────────────────────────
    pgadmin:
        image: dpage/pgadmin4:9.9.0
        container_name: pgadmin
        restart: always
        environment:
            PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
            PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
        ports:
            - "127.0.0.1:5050:80"
        volumes:
            - pgadmin_data:/var/lib/pgadmin
        networks:
            - appointment-net
            - consultation-net
            - prescription-net
            - user-net
            - ai-net

    # ── Keycloak ──────────────────────────────────────────────────────────────
    keycloak:
        image: quay.io/keycloak/keycloak:24.0.1
        container_name: keycloak
        restart: unless-stopped
        environment:
            KC_DB: postgres
            KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak_db
            KC_DB_USERNAME: keycloak_user
            KC_DB_PASSWORD: keycloak_pass
            KC_DB_SCHEMA: public
            KEYCLOAK_ADMIN: admin
            KEYCLOAK_ADMIN_PASSWORD: admin123
            # Keycloak is served under /auth so Caddy can expose it on the same domain
            KC_HTTP_RELATIVE_PATH: /auth
            # Public URL the browser uses (set PUBLIC_URL=https://opdvertex.dk on the server)
            KC_HOSTNAME_URL: ${PUBLIC_URL:-http://localhost:8089}/auth
            # Admin console stays local-only: reach it through an SSH tunnel on port 8089
            KC_HOSTNAME_ADMIN_URL: http://localhost:8089/auth
            KC_PROXY_HEADERS: xforwarded
        command: start-dev --import-realm
        ports:
            - "127.0.0.1:8089:8080"
        volumes:
            - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
        networks:
            - frontend
            - internal-api
            - keycloak-net
        healthcheck:
            test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 20s
        depends_on:
            keycloak-db:
                condition: service_healthy

    keycloak-db:
        image: postgres:17
        container_name: keycloak-db
        restart: always
        environment:
            POSTGRES_USER: keycloak_user
            POSTGRES_PASSWORD: keycloak_pass
            POSTGRES_DB: keycloak_db
        ports:
            - "127.0.0.1:5437:5432"
        volumes:
            - keycloak_db_data:/var/lib/postgresql/data
        networks:
            - keycloak-net
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U keycloak_user -d keycloak_db"]
            interval: 5s
            timeout: 10s
            retries: 5
            start_period: 5s

    # ── Caddy (HTTPS reverse proxy, production only) ──────────────────────────
    # Started only with the "prod" profile (COMPOSE_PROFILES=prod in the server .env).
    # Serves the built Vue app from ./frontend-dist and proxies /api and /auth.
    caddy:
        image: caddy:2
        container_name: caddy
        profiles: ["prod"]
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            - ./frontend-dist:/srv:ro
            - caddy_data:/data
            - caddy_config:/config
        networks:
            - frontend
        depends_on:
            - gateway
            - keycloak
