name: CI gateway

on:
  push:
    branches: [main]
    paths: ["backend/gateway/**"]
  pull_request:
    branches: [main]
    paths: ["backend/gateway/**"]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/gateway
    env:
      APPOINTMENT_SERVICE_URL: http://appointment-service:8000
      CONSULTATION_SERVICE_URL: http://consultation-service:8000
      USER_SERVICE_URL: http://user-service:8000
      PRESCRIPTION_SERVICE_URL: http://prescription-service:8000
      TRANSCRIPTION_SERVICE_URL: http://localhost:8000
      EMAIL_SERVICE_URL: http://email-service:8000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Ruff format check
        run: uv run ruff format --check

      - name: Ruff lint
        run: uv run ruff check

      - name: Run pytest
        run: uv run pytest --cov=src --cov-report=xml:coverage.xml --cov-branch

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/gateway/coverage.xml
          flags: gateway
          fail_ci_if_error: false